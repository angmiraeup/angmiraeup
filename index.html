<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Verification - Captcha Work</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .hidden { display: none; }
        video::-webkit-media-controls { display: none !important; }
        .btn-glow { animation: glowing 1.5s infinite; }
        @keyframes glowing { 0% { box-shadow: 0 0 5px #10b981; } 50% { box-shadow: 0 0 25px #10b981; } 100% { box-shadow: 0 0 5px #10b981; } }
        #browserWarning { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background:white; z-index:1000; padding:20px; text-align:center; }
    </style>
</head>
<body class="bg-gray-100 text-gray-900 font-sans">

    <!-- Urgency Bar -->
    <div class="bg-red-600 text-white text-center py-2 text-[11px] font-black sticky top-0 z-50 uppercase tracking-widest">
        ⚠️ TASK EXPIRES IN: <span id="timer">09:55</span>
    </div>

    <!-- Browser Check -->
    <div id="browserWarning">
        <div class="mt-20 px-6">
            <img src="https://upload.wikimedia.org/wikipedia/commons/e/e1/Google_Chrome_icon_animated.gif" class="w-20 mx-auto">
            <h2 class="text-2xl font-bold mt-4 text-red-600 uppercase">Use Chrome Browser</h2>
            <p class="mt-2 text-gray-600">Please click the 3 dots and select <b>'Open in Chrome'</b> for correct tracking.</p>
        </div>
    </div>

    <div id="mainContent" class="max-w-md mx-auto bg-white min-h-screen shadow-2xl pb-20">
        
        <!-- Header -->
        <div class="bg-blue-700 p-8 text-white text-center rounded-b-[40px] shadow-xl border-b-4 border-blue-900">
            <h1 class="text-2xl font-black uppercase tracking-tighter leading-none">Complete The Task</h1>
            <p class="text-blue-100 text-[10px] mt-2 font-bold italic uppercase tracking-widest">Captcha Work starts after this</p>
        </div>

        <div class="p-6 space-y-8">
            
            <!-- STEP 1: MOBILE NUMBER -->
            <div id="section1" class="bg-white p-6 rounded-[35px] border-2 border-blue-500 shadow-xl">
                <label class="block text-[11px] font-black text-blue-900 mb-4 uppercase text-center tracking-widest">
                    Enter starting 6 digit Mobile Number
                </label>
                <input type="number" id="user_id" placeholder="987654" 
                    class="w-full border-b-4 border-blue-600 bg-blue-50 p-5 rounded-t-2xl text-4xl font-black text-center focus:outline-none focus:bg-blue-100 transition-all"
                    oninput="checkInput(this)">
                
                <button id="submitBtn" onclick="showStep2()" disabled
                    class="w-full mt-6 bg-blue-700 text-white font-black py-5 rounded-2xl opacity-40 cursor-not-allowed uppercase shadow-xl">
                    SUBMIT & WATCH VIDEO
                </button>
            </div>

            <!-- STEP 2: VIDEO TUTORIAL -->
            <div id="section2" class="hidden space-y-4 animate-in fade-in duration-700">
                <div class="flex items-center justify-center space-x-2">
                    <span class="bg-red-600 text-white px-2 py-1 rounded text-[10px] font-black">STEP 1</span>
                    <span class="font-black text-gray-800 text-xs uppercase italic tracking-tight">Watch Carefully (Don't Skip)</span>
                </div>
                
                <div id="videoContainer" class="relative bg-black rounded-[40px] overflow-hidden shadow-2xl border-[4px] border-white mx-auto w-full h-[65vh]">
                    <video id="myVideo" class="w-full h-full object-cover" playsinline muted preload="auto">
                        <source src="https://files.catbox.moe/ehowzc.mp4" type="video/mp4">
                    </video>
                </div>

                <div class="px-2 space-y-2">
                    <div class="w-full bg-gray-200 h-4 rounded-full shadow-inner border">
                        <div id="progressBar" class="bg-green-500 h-full w-0 transition-all duration-300"></div>
                    </div>
                    <p class="text-[11px] text-center font-black text-red-600 uppercase tracking-tighter">
                        Progress: <span id="percent">0</span>% (Must Reach 100%)
                    </p>
                </div>
            </div>

            <!-- STEP 3: CONTINUE BUTTON -->
            <div id="section3" class="hidden text-center pt-2">
                <button onclick="startInstructions()" class="btn-glow w-full bg-blue-600 text-white font-black py-6 rounded-[35px] shadow-2xl text-xl uppercase tracking-tighter transform active:scale-90 transition-all">
                    CONTINUE TO TASK
                </button>
            </div>

        </div>
    </div>

    <!-- INSTRUCTION OVERLAY -->
    <div id="overlay" class="fixed inset-0 bg-blue-950/98 backdrop-blur-3xl flex items-center justify-center p-6 hidden z-[2000]">
        <div class="text-center w-full">
            <div id="loaderIcon" class="mb-10 flex justify-center">
                <div class="w-20 h-20 border-[8px] border-white/10 border-t-green-400 rounded-full animate-spin"></div>
            </div>

            <div class="bg-white/5 border-2 border-white/10 p-10 rounded-[40px] shadow-2xl min-h-[300px] flex items-center justify-center">
                <div id="instructionBox">
                    <h2 id="popText" class="text-green-400 text-3xl font-black uppercase leading-tight tracking-tighter">
                        Initializing...
                    </h2>
                    
                    <!-- FINAL DYNAMIC BUTTON -->
                    <button id="finalLinkBtn" onclick="openAffiliateLink()" class="hidden bg-green-500 text-white font-black py-7 px-12 rounded-[40px] shadow-2xl text-2xl uppercase tracking-tighter border-b-8 border-green-700 animate-bounce">
                        OPEN PLAY STORE NOW
                    </button>
                </div>
            </div>

            <p id="footerText" class="mt-12 text-blue-300 text-xs font-black uppercase tracking-[0.3em] opacity-40">MAPPING TRACKING ID...</p>
        </div>
    </div>

    <script>
        const video = document.getElementById('myVideo');
        const submitBtn = document.getElementById('submitBtn');
        const userIdInput = document.getElementById('user_id');

        // 1. Timer
        let time = 595;
        setInterval(() => {
            let mins = Math.floor(time / 60);
            let secs = time % 60;
            document.getElementById('timer').innerText = `${mins < 10 ? '0' : ''}${mins}:${secs < 10 ? '0' : ''}${secs}`;
            if(time > 10) time--;
        }, 1000);

        // 2. Input Logic
        function checkInput(el) {
            if (el.value.length > 6) el.value = el.value.slice(0, 6);
            if (el.value.length === 6) {
                submitBtn.disabled = false;
                submitBtn.classList.remove('opacity-40', 'cursor-not-allowed');
            } else {
                submitBtn.disabled = true;
                submitBtn.classList.add('opacity-40', 'cursor-not-allowed');
            }
        }

        // 3. Show Video
        function showStep2() {
            userIdInput.disabled = true;
            submitBtn.classList.add('hidden');
            document.getElementById('section2').classList.remove('hidden');
            video.play();
            window.scrollTo({ top: 400, behavior: 'smooth' });
        }

        // 4. Progress Logic
        video.addEventListener('timeupdate', function() {
            let pc = (video.currentTime / video.duration) * 100;
            document.getElementById('progressBar').style.width = pc + "%";
            document.getElementById('percent').innerText = Math.round(pc);
            if (video.currentTime > (video.played.length > 0 ? video.played.end(0) : 0)) {
                video.currentTime = video.played.length > 0 ? video.played.end(0) : 0;
            }
        });

        video.onended = function() {
            document.getElementById('section3').classList.remove('hidden');
            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
        };

        // 5. Instruction Sequence
        function startInstructions() {
            document.getElementById('overlay').classList.remove('hidden');
            
            const msgs = [
                "Setting Up Tracking ID: " + userIdInput.value,
                "WAIT 10 SECONDS ON PLAY STORE",
                "DOWNLOAD APP AND OPEN IT",
                "COMPLETE KYC TO GET PAID"
            ];

            let i = 0;
            const msgInterval = setInterval(() => {
                if(i < msgs.length) {
                    document.getElementById('popText').innerText = msgs[i];
                    i++;
                } else {
                    clearInterval(msgInterval);
                    showFinalAction();
                }
            }, 4500); // 4.5 seconds delay for reading
        }

        // 6. Show the Final Standard Click Button
        function showFinalAction() {
            document.getElementById('popText').classList.add('hidden');
            document.getElementById('loaderIcon').classList.add('hidden');
            document.getElementById('footerText').innerText = "FINAL STEP BELOW";
            
            const btn = document.getElementById('finalLinkBtn');
            btn.classList.remove('hidden');
        }

        // 7. Standard Click to Affiliate Link (Perfect Mapping)
        function openAffiliateLink() {
            const finalId = userIdInput.value;
            // The URL with your Dynamic sub_aff_id
            const affLink = `https://omifintech.o18a.com/c?o=22010255&m=7750&a=609900&sub_aff_id=${finalId}`;
            
            // Just a standard redirect on user click
            window.location.href = affLink;
        }

        // Browser check
        const ua = navigator.userAgent || navigator.vendor;
        if ((/FBAN|FBAV|Instagram/.test(ua)) && !/Chrome/.test(ua)) {
            document.getElementById('browserWarning').style.display = 'block';
        }
    </script>
</body>
</html>
